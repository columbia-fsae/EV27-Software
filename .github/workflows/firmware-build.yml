name: Firmware Build

# Build the STM32/CubeMX firmware projects with CMake. The CI Gate job ALWAYS
# runs (so the required status check always resolves), while the matrix build
# only runs for projects whose files actually changed. Require "CI Gate" in
# branch protection
#
# To add a new CubeMX/CMake project: add a filter entry under `changes.filter`
# below, and a matching `project`/`path` pair in `build.strategy.matrix.include`.

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.filter.outputs.changes }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            Tractive_Battery:
              - 'High_Voltage/Tractive_Battery/**'
              - '.github/workflows/firmware-build.yml'
            Charging_Cart_UI:
              - 'High_Voltage/Charging_Cart/UI/STM32/**'
              - '.github/workflows/firmware-build.yml'

  # ──────────────── Build changed firmware projects ────────────────
  build:
    needs: changes
    if: needs.changes.outputs.matrix != '[]'
    runs-on: ubuntu-latest
    name: Build ${{ matrix.project }}
    strategy:
      fail-fast: false
      matrix:
        project: ${{ fromJSON(needs.changes.outputs.matrix) }}
        include:
          - project: Tractive_Battery
            path: High_Voltage/Tractive_Battery
          - project: Charging_Cart_UI
            path: High_Voltage/Charging_Cart/UI/STM32
    env:
      PROJECT_PATH: ${{ matrix.path }}
    steps:
      - uses: actions/checkout@v4
      - name: Install ARM GCC toolchain
        uses: carlosperate/arm-none-eabi-gcc-action@v1
        with:
          release: '14.2.Rel1'
      - name: Install CMake and Ninja
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build
          arm-none-eabi-gcc --version | head -1
          cmake --version | head -1
          ninja --version
      - name: Configure (Debug)
        working-directory: ${{ env.PROJECT_PATH }}
        run: cmake --preset Debug
      - name: Build (Debug)
        working-directory: ${{ env.PROJECT_PATH }}
        run: cmake --build --preset Debug
      - name: Report binary size
        working-directory: ${{ env.PROJECT_PATH }}
        run: |
          elf=$(find build -name '*.elf' | head -1)
          if [ -n "$elf" ]; then
            echo "Built: $elf"; arm-none-eabi-size "$elf"
          else
            echo "No .elf produced"; exit 1
          fi
      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.project }}-firmware
          path: |
            ${{ env.PROJECT_PATH }}/build/**/*.elf
            ${{ env.PROJECT_PATH }}/build/**/*.hex
            ${{ env.PROJECT_PATH }}/build/**/*.bin
          if-no-files-found: warn

  # ──────────────── Gate: always runs, this is the REQUIRED check ────────────────
  ci-gate:
    if: always()
    needs: [build]
    runs-on: ubuntu-latest
    name: CI Gate
    steps:
      - name: Verify builds passed or were skipped
        run: |
          r="${{ needs.build.result }}"
          echo "Build: $r"
          if [ "$r" = "failure" ] || [ "$r" = "cancelled" ]; then
            echo "A firmware build failed."
            exit 1
          fi
          echo "OK — all required builds passed or were not needed."
