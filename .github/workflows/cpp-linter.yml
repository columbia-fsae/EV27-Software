name: C/C++ Lint

# Runs clang-format + clang-tidy (via cpp-linter-action) against changed
# firmware files only. The CPP Lint Gate job ALWAYS runs (so it's safe to
# require in branch protection on every PR, not just firmware ones), while
# the matrix lint job only runs for projects whose files actually changed.
# Require "CPP Lint Gate" in branch protection — not "Lint <project>".
#
# Each project gets its own CMake configure step first so clang-tidy has a
# real compile_commands.json to resolve includes from — without it, it can't
# find STM32 HAL/CMSIS headers and produces spurious "file not found" errors
# instead of real findings.
#
# Style/checks come from the repo-root .clang-format and .clang-tidy files —
# keep those in sync with the same-named hooks in .pre-commit-config.yaml.
#
# To add a new CubeMX/CMake project: add a filter entry under `changes.filter`
# below, and a matching `project`/`path` pair in the `changes` job's
# "Build project/path matrix" step.

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  # ──────────────── Detect which firmware projects changed ────────────────
  changes:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.build-matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            Tractive_Battery:
              - 'High_Voltage/Tractive_Battery/**'
              - '.clang-format'
              - '.clang-tidy'
              - '.github/workflows/cpp-linter.yml'
            Charging_Cart_UI:
              - 'High_Voltage/Charging_Cart/UI/STM32/**'
              - '.clang-format'
              - '.clang-tidy'
              - '.github/workflows/cpp-linter.yml'

      # dorny/paths-filter only tells us WHICH projects changed, as a list of
      # names. Build the {project, path, ignore} triples the lint matrix
      # actually needs here, so only changed projects appear in the matrix.
      # Feeding a static `include:` list alongside a dynamic `project:` array
      # (the previous approach) doesn't work: GitHub Actions adds any
      # `include` entry whose keys don't match an existing combination as a
      # BRAND NEW job, instead of dropping it — so every project in `include`
      # always ran, regardless of what actually changed.
      #
      # `ignore` is every OTHER known project's path, joined with `.github`.
      # cpp-linter-action's files-changed-only fetches the WHOLE PR's changed
      # files (not just this job's matrix.path), so without this, a PR that
      # touches both projects' files — or just .clang-format/cpp-linter.yml,
      # which puts every project in the matrix — has each job linting the
      # other project's files too, against its own (wrong) compile database.
      - name: Build project/path matrix
        id: build-matrix
        run: |
          all_paths='High_Voltage/Tractive_Battery|High_Voltage/Charging_Cart/UI/STM32'
          matrix='[]'
          if [ "${{ steps.filter.outputs.Tractive_Battery }}" = "true" ]; then
            path='High_Voltage/Tractive_Battery'
            ignore=".github|$(echo "$all_paths" | tr '|' '\n' | grep -vF "$path" | paste -sd'|')"
            matrix=$(echo "$matrix" | jq -c --arg path "$path" --arg ignore "$ignore" \
              '. + [{"project":"Tractive_Battery","path":$path,"ignore":$ignore}]')
          fi
          if [ "${{ steps.filter.outputs.Charging_Cart_UI }}" = "true" ]; then
            path='High_Voltage/Charging_Cart/UI/STM32'
            ignore=".github|$(echo "$all_paths" | tr '|' '\n' | grep -vF "$path" | paste -sd'|')"
            matrix=$(echo "$matrix" | jq -c --arg path "$path" --arg ignore "$ignore" \
              '. + [{"project":"Charging_Cart_UI","path":$path,"ignore":$ignore}]')
          fi
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  # ──────────────── Lint changed firmware projects ────────────────
  lint:
    needs: changes
    if: needs.changes.outputs.matrix != '[]'
    runs-on: ubuntu-latest
    name: Lint ${{ matrix.project }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.changes.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4

      - name: Install ARM GCC toolchain
        uses: carlosperate/arm-none-eabi-gcc-action@v1
        with:
          release: '14.2.Rel1'

      - name: Install CMake and Ninja
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build

      - name: Configure (generates compile_commands.json)
        working-directory: ${{ matrix.path }}
        run: cmake --preset Debug

      - name: Lint
        uses: cpp-linter/cpp-linter-action@v2
        id: linter
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          style: 'file'          # use repo-root .clang-format
          tidy-checks: ''        # use repo-root .clang-tidy
          database: ${{ matrix.path }}/build/Debug
          files-changed-only: true
          ignore: ${{ matrix.ignore }}
          thread-comments: ${{ github.event_name == 'pull_request' && 'update' || false }}
          step-summary: true

      - name: Fail on lint errors
        if: steps.linter.outputs.checks-failed > 0
        run: exit 1

  # ──────────────── Gate: always runs, this is the REQUIRED check ────────────────
  cpp-lint-gate:
    if: always()
    needs: [lint]
    runs-on: ubuntu-latest
    name: CPP Lint Gate
    steps:
      - name: Verify lint passed or was skipped
        run: |
          r="${{ needs.lint.result }}"
          echo "Lint: $r"
          if [ "$r" = "failure" ] || [ "$r" = "cancelled" ]; then
            echo "A C/C++ lint check failed."
            exit 1
          fi
          echo "OK — all required lint checks passed or were not needed."
