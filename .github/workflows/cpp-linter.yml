name: C/C++ Lint

# Runs clang-format + clang-tidy (via cpp-linter-action) against changed
# firmware files only. The CPP Lint Gate job ALWAYS runs, while
# the matrix lint job only runs for projects whose files actually changed.
# Require "CPP Lint Gate" in branch protection — not "Lint <project>".
#
# Each project gets its own CMake configure step first so clang-tidy has a
# real compile_commands.json to resolve includes from
#
# Style/checks come from the repo-root .clang-format and .clang-tidy files —
# keep those in sync with the same-named hooks in .pre-commit-config.yaml.
#
# To add a new CubeMX/CMake project: add a filter entry under `changes.filter`
# below, and a matching `project`/`path` pair in the `changes` job's
# "Build project/path matrix" step.

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  # ──────────────── Detect which firmware projects changed ────────────────
  changes:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.build-matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            Tractive_Battery:
              - 'High_Voltage/Tractive_Battery/**'
              - '.clang-format'
              - '.clang-tidy'
              - '.github/workflows/cpp-linter.yml'
            Charging_Cart_UI:
              - 'High_Voltage/Charging_Cart/UI/STM32/**'
              - '.clang-format'
              - '.clang-tidy'
              - '.github/workflows/cpp-linter.yml'

      # dorny/paths-filter only tells us WHICH projects changed\
      #
      # `ignore` is every OTHER known project's path, joined with `.github`.
      # cpp-linter-action's files-changed-only fetches the WHOLE PR's changed
      # files (not just this job's matrix.path)
      #
      # `non_firmware` covers C/C++ that isn't part of any CMake project
      # (Arduino sketches, simulations). It's not in any compile_commands.json,
      # so clang-tidy can't resolve its includes (e.g. Arduino.h) and would
      # fail the job. Add new non-CMake C/C++ directories here.
      #
      # Each project's own $path/Drivers (vendor CMSIS/HAL) and
      # $path/cmake/stm32cubemx (CubeMX-generated glue) are also ignored —
      # same generated-code exclusion .pre-commit-config.yaml already
      # applies
      - name: Build project/path matrix
        id: build-matrix
        run: |
          all_paths='High_Voltage/Tractive_Battery|High_Voltage/Charging_Cart/UI/STM32'
          non_firmware='Low_Voltage|Simulations'
          matrix='[]'
          if [ "${{ steps.filter.outputs.Tractive_Battery }}" = "true" ]; then
            path='High_Voltage/Tractive_Battery'
            ignore=".github|$non_firmware|$path/Drivers|$path/cmake/stm32cubemx|$(echo "$all_paths" | tr '|' '\n' | grep -vF "$path" | paste -sd'|')"
            matrix=$(echo "$matrix" | jq -c --arg path "$path" --arg ignore "$ignore" \
              '. + [{"project":"Tractive_Battery","path":$path,"ignore":$ignore}]')
          fi
          if [ "${{ steps.filter.outputs.Charging_Cart_UI }}" = "true" ]; then
            path='High_Voltage/Charging_Cart/UI/STM32'
            ignore=".github|$non_firmware|$path/Drivers|$path/cmake/stm32cubemx|$(echo "$all_paths" | tr '|' '\n' | grep -vF "$path" | paste -sd'|')"
            matrix=$(echo "$matrix" | jq -c --arg path "$path" --arg ignore "$ignore" \
              '. + [{"project":"Charging_Cart_UI","path":$path,"ignore":$ignore}]')
          fi
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  # ──────────────── Lint changed firmware projects ────────────────
  lint:
    needs: changes
    if: needs.changes.outputs.matrix != '[]'
    runs-on: ubuntu-latest
    name: Lint ${{ matrix.project }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.changes.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4

      - name: Install ARM GCC toolchain
        uses: carlosperate/arm-none-eabi-gcc-action@v1
        with:
          release: '14.2.Rel1'

      # --gcc-toolchain=<root> (passed to clang-tidy below via extra-arg)
      # points it at the install so it picks the right multilib
      # (cortex-m0 => armv6-m/nofp) automatically.
      - name: Resolve ARM GCC toolchain root
        id: arm-gcc-root
        run: |
          arm_cxx="$(command -v arm-none-eabi-g++)"
          root="$(dirname "$(dirname "$arm_cxx")")"
          echo "ARM C++ compiler: $arm_cxx"
          echo "Toolchain root:   $root"
          echo "root=$root" >> "$GITHUB_OUTPUT"

      - name: Install CMake and Ninja
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build

      - name: Configure (generates compile_commands.json)
        working-directory: ${{ matrix.path }}
        run: cmake --preset Debug

      - name: Lint
        uses: cpp-linter/cpp-linter-action@v2
        id: linter
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          style: 'file'          # use repo-root .clang-format
          tidy-checks: ''        # use repo-root .clang-tidy
          database: ${{ matrix.path }}/build/Debug
          files-changed-only: true
          # Only gate on lines this PR actually touches, not pre-existing
          # findings elsewhere in a changed file. To see every clang-tidy
          # finding in a file regardless of what changed
          #   pip install clang-tidy==21.1.6
          #   cmake --preset Debug   (from the project's directory, e.g.
          #                          High_Voltage/Charging_Cart/UI/STM32)
          #   clang-tidy -p <project>/build/Debug <path/to/file.cpp>
          # (picks up the repo-root .clang-tidy automatically)
          lines-changed-only: true
          ignore: ${{ matrix.ignore }}
          thread-comments: ${{ github.event_name == 'pull_request' && 'update' || false }}
          step-summary: true
          # See "Resolve ARM GCC toolchain root" above — lets clang-tidy find
          # arm-none-eabi-g++'s bundled <cstdio>/<cstdint>/etc.
          extra-args: --gcc-toolchain=${{ steps.arm-gcc-root.outputs.root }}

      - name: Fail on lint errors
        if: steps.linter.outputs.checks-failed > 0
        run: exit 1

  # ──────────────── Gate: always runs, this is the REQUIRED check ────────────────
  cpp-lint-gate:
    if: always()
    needs: [lint]
    runs-on: ubuntu-latest
    name: CPP Lint Gate
    steps:
      - name: Verify lint passed or was skipped
        run: |
          r="${{ needs.lint.result }}"
          echo "Lint: $r"
          if [ "$r" = "failure" ] || [ "$r" = "cancelled" ]; then
            echo "A C/C++ lint check failed."
            exit 1
          fi
          echo "OK — all required lint checks passed or were not needed."
