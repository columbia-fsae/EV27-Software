name: C/C++ Lint

# Runs clang-format + clang-tidy (via cpp-linter-action) against changed
# firmware files only. Each project gets its own CMake configure step first
# so clang-tidy has a real compile_commands.json to resolve includes from —
# without it, clang-tidy can't find STM32 HAL/CMSIS headers and produces
# spurious "file not found" errors instead of real findings.
#
# Style/checks come from the repo-root .clang-format and .clang-tidy files —
# keep those in sync with the same-named hooks in .pre-commit-config.yaml.

on:
  pull_request:
    paths:
      - '**/*.c'
      - '**/*.h'
      - '**/*.cpp'
      - '**/*.hpp'
      - '.clang-format'
      - '.clang-tidy'
      - '.github/workflows/cpp-linter.yml'
  push:
    branches: [ main ]
    paths:
      - '**/*.c'
      - '**/*.h'
      - '**/*.cpp'
      - '**/*.hpp'
      - '.clang-format'
      - '.clang-tidy'
      - '.github/workflows/cpp-linter.yml'

jobs:
  lint:
    runs-on: ubuntu-latest
    name: Lint ${{ matrix.project }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: Tractive_Battery
            path: High_Voltage/Tractive_Battery
          - project: Charging_Cart_UI
            path: High_Voltage/Charging_Cart/UI/STM32
    steps:
      - uses: actions/checkout@v4

      - name: Install ARM GCC toolchain
        uses: carlosperate/arm-none-eabi-gcc-action@v1
        with:
          release: '14.2.Rel1'

      - name: Install CMake and Ninja
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build

      - name: Configure (generates compile_commands.json)
        working-directory: ${{ matrix.path }}
        run: cmake --preset Debug

      - name: Lint
        uses: cpp-linter/cpp-linter-action@v2
        id: linter
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          style: 'file'          # use repo-root .clang-format
          tidy-checks: ''        # use repo-root .clang-tidy
          database: ${{ matrix.path }}/build/Debug
          files-changed-only: true
          thread-comments: ${{ github.event_name == 'pull_request' && 'update' || false }}
          step-summary: true

      - name: Fail on lint errors
        if: steps.linter.outputs.checks-failed > 0
        run: exit 1
