name: Unit Tests

# Host-side unit tests for the Tractive Battery firmware (Unity + FFF), built
# with gcc. The test job runs with ASan/UBSan and -Werror on test code; the
# coverage job uploads an HTML report as an artifact.
#
# Run the same thing locally from High_Voltage/Tractive_Battery:
#   cmake -S Tests -B Tests/build -G Ninja
#   cmake --build Tests/build
#   ctest --test-dir Tests/build --output-on-failure

on:
  push:
    paths:
      - 'High_Voltage/Tractive_Battery/**'
      - '.github/workflows/unit-tests.yml'
  pull_request:
    paths:
      - 'High_Voltage/Tractive_Battery/**'
      - '.github/workflows/unit-tests.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    name: Tractive Battery tests (ASan + UBSan)
    defaults:
      run:
        working-directory: High_Voltage/Tractive_Battery
    steps:
      - uses: actions/checkout@v4
      - name: Install CMake and Ninja
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build
          gcc --version | head -1
          cmake --version | head -1
      - name: Configure (sanitizers on)
        run: cmake -S Tests -B Tests/build -G Ninja -DTB_TESTS_SANITIZE=ON -DTB_TESTS_WERROR=ON
      - name: Build
        run: cmake --build Tests/build
      - name: Test
        run: ctest --test-dir Tests/build --output-on-failure

  coverage:
    runs-on: ubuntu-latest
    name: Tractive Battery coverage
    defaults:
      run:
        working-directory: High_Voltage/Tractive_Battery
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install CMake, Ninja and gcovr
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build
          pip install gcovr
      - name: Configure (coverage on)
        run: cmake -S Tests -B Tests/build -G Ninja -DTB_TESTS_COVERAGE=ON -DTB_TESTS_SANITIZE=OFF
      - name: Build, test and write the report
        run: cmake --build Tests/build --target coverage
      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: tractive-battery-coverage
          path: High_Voltage/Tractive_Battery/Tests/build/coverage/
          if-no-files-found: error
