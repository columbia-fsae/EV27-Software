# Vendor/generated firmware code (STM32 CMSIS/HAL drivers, CubeMX glue) is
# excluded from every hook below via this global pattern
exclude: '(^|/)(Drivers|build|Debug)/|/cmake/stm32cubemx/|\.(ld|ioc|s|S)$'

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-yaml
      - id: end-of-file-fixer
        # CAN .dbc files are never touched by reformatting hooks
        exclude: '\.dbc$'
      - id: trailing-whitespace
        exclude: '\.dbc$'

  - repo: local
    hooks:
      - id: dbc-validate
        name: Validate CAN .dbc files parse
        description: >-
          Parses every changed .dbc with cantools to catch malformed CAN
          database syntax (unparseable BO_/SG_ defs, duplicate message IDs,
          etc.) without ever rewriting the file.
        entry: python3 -c "import sys, cantools; [cantools.database.load_file(f, strict=True) for f in sys.argv[1:]]"
        language: python
        additional_dependencies: ['cantools']
        files: '\.dbc$'

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.4
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/cpp-linter/cpp-linter-hooks
    rev: v1.6.0
    hooks:
      - id: clang-format
        # Pinned to match cpp-linter.yml's CI version exactly — different
        # clang-format majors can disagree on formatting for the same file
        # and config, so an unpinned local hook silently drifts from CI.
        args: [--style=file, --version=21]
      - id: clang-tidy
        # Needs a CMake compile_commands.json to resolve includes correctly,
        # which this repo only generates in the cpp-linter.yml CI workflow.
        # Run manually (`pre-commit run --hook-stage manual clang-tidy`)
        # after a `cmake --preset Debug` configure if you want it locally.
        args: [--version=21]
        stages: [manual]
